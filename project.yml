name: Take
options:
  bundleIdPrefix: com.siddharthnigam
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: X7AQ5M6X64
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    SWIFT_STRICT_CONCURRENCY: minimal

packages:
  ManuscriptKit:
    path: ManuscriptKit

targets:
  Take:
    type: application
    platform: macOS
    sources:
      - path: Take
        excludes:
          - "Resources/**"
          - "Take.entitlements"
      - path: Take/Resources
        buildPhase: resources
        type: folder
    dependencies:
      - package: ManuscriptKit
        product: ManuscriptKit
    info:
      path: Take/Info.plist
      properties:
        CFBundleDisplayName: Take
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "© 2026 Siddharth Nigam"
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.siddharthnigam.take
        PRODUCT_NAME: Take
        CODE_SIGN_ENTITLEMENTS: Take/Take.entitlements
        ENABLE_APP_SANDBOX: YES
        COMBINE_HIDPI_IMAGES: YES

schemes:
  Take:
    build:
      targets:
        Take: all
    run:
      config: Debug
